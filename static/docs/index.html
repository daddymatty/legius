<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root {
    --black:#0D0D0F; --ink:#101828; --mut:#818a9c; --line:#e9ecf2;
    --bg:#f2f4f7; --card:#ffffff; --accent:#E13D27;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding-bottom:36px; }
  .head { background:var(--black); color:#fff; padding:26px 20px 48px; border-top:3px solid var(--accent);
           display:flex; flex-direction:column; align-items:center; gap:8px; }
  .logo { display:flex; align-items:center; font-family:'Jost',Montserrat,system-ui,sans-serif;
           font-weight:300; font-size:30px; letter-spacing:.34em; color:#fff; line-height:1; }
  .logo .e { display:flex; flex-direction:column; justify-content:space-between;
              width:.5em; height:.7em; margin-right:.34em; }
  .logo .e i { display:block; width:100%; height:.052em; background:#fff; }
  .logo .e i:first-child { background:var(--accent); }
  .head .sub { font-size:12.5px; color:#9aa1af; letter-spacing:1.2px; text-transform:uppercase; }
  .card { background:var(--card); border-radius:18px; margin:-28px 14px 0; padding:20px 18px;
           box-shadow:0 6px 20px rgba(13,13,15,.12); }
  .field { margin-bottom:15px; }
  .row2f { display:flex; gap:10px; }
  .row2f .field { flex:1; }
  .field label { display:block; font-size:11.5px; font-weight:700; letter-spacing:.7px;
                  text-transform:uppercase; color:var(--mut); margin-bottom:6px; }
  .field select, .field input, .field textarea {
    width:100%; font:inherit; font-size:15.5px; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:12px; background:#fbfcfe; color:var(--ink); outline:none;
  }
  .field select:focus, .field input:focus, .field textarea:focus { border-color:var(--accent); background:#fff; }
  .field textarea { resize:vertical; min-height:64px; }
  .field .meta { font-size:11px; color:var(--mut); margin-top:4px; }
  .sect { font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
           color:var(--mut); margin:20px 0 12px; padding-top:14px; border-top:1px solid var(--line); }
  .btn { display:block; width:100%; font:inherit; font-size:16px; font-weight:700; color:#fff;
          background:var(--accent); border:none; border-radius:12px; padding:14px; cursor:pointer; }
  .btn[disabled] { background:#c9ced8; cursor:not-allowed; }
  .btn:active { filter:brightness(.92); }
  .note { font-size:12px; color:var(--mut); margin-top:12px; line-height:1.5; }
  footer { text-align:center; font-size:12px; color:var(--mut); margin-top:24px; padding:0 20px; }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .only-uhoda, .only-dohovir, .only-rakhunok, .only-ur { display:none; }
  body[data-doc="dohovir"] .only-dohovir { display:block; }
  body[data-doc="uhoda"] .only-uhoda { display:block; }
  body[data-doc="rakhunok"] .only-rakhunok { display:block; }
  body[data-doc="uhoda"] .only-ur, body[data-doc="rakhunok"] .only-ur { display:block; }
  body[data-doc="dohovir"] .row2f.only-dohovir { display:flex; }
  body[data-doc="uhoda"] .row2f.only-uhoda, body[data-doc="uhoda"] .row2f.only-ur { display:flex; }
  body[data-doc="rakhunok"] .row2f.only-rakhunok, body[data-doc="rakhunok"] .row2f.only-ur { display:flex; }

  /* ---- друкований документ ---- */
  #docWrap { display:none; }
  body.doc-mode #formWrap { display:none; }
  body.doc-mode #docWrap { display:block; }
  .docbar { position:sticky; top:0; z-index:10; background:var(--black); padding:10px 14px;
             display:flex; gap:10px; justify-content:center; }
  .docbar button { font:inherit; font-size:14px; font-weight:700; border:none; border-radius:10px;
                    padding:10px 18px; cursor:pointer; }
  .docbar .print { background:var(--accent); color:#fff; }
  .docbar .back { background:#2a2a30; color:#fff; }
  .sheet { background:#fff; max-width:794px; margin:18px auto; padding:57px 57px 57px 71px;
            box-shadow:0 6px 24px rgba(13,13,15,.15);
            font-family:'Times New Roman', Times, serif; font-size:10.5pt; line-height:1.32;
            color:#000; text-align:justify; }
  .sheet .title { text-align:center; font-weight:bold; }
  .sheet .cityline { display:flex; justify-content:space-between; margin:14px 0; }
  .sheet p.body { text-indent:28px; margin:2px 0; }
  .sheet h2 { font-size:10.5pt; font-weight:bold; text-align:center; margin:12px 0 4px; }
  .sheet .req { display:flex; gap:24px; margin-top:12px; }
  .sheet .req > div { flex:1; }
  .sheet .req .rt { font-weight:bold; margin-bottom:6px; }
  .sheet .sig { text-align:center; margin-top:28px; }
  .sheet table.itable { width:100%; border-collapse:collapse; margin-top:8px; }
  .sheet table.itable th, .sheet table.itable td { border:1px solid #000; padding:5px 7px; vertical-align:top; }
  .sheet table.itable th { text-align:center; font-weight:bold; }
  .sheet .inv-head { display:flex; justify-content:space-between; gap:20px; margin-top:8px; }
  .sheet .inv-head .r { text-align:left; max-width:46%; }
  .sheet .inv-title { font-size:14pt; font-weight:bold; }
  .sheet .vypysav { margin-top:34px; display:flex; align-items:flex-end; gap:12px; }
  .sheet .vypysav .line { position:relative; width:220px; border-bottom:1px solid #000; height:34px; }
  .sheet .vypysav .line img { position:absolute; left:30px; bottom:-6px; height:54px; }
  @media print {
    body { background:#fff; }
    .docbar { display:none; }
    .sheet { box-shadow:none; margin:0; max-width:none; padding:0; }
    @page { size: A4; margin: 20mm 15mm 20mm 25mm; }
  }
</style>
</head>
<body data-doc="dohovir">
<div id="formWrap">
<div class="wrap">
  <div class="head">
    <div class="logo">L<span class="e"><i></i><i></i><i></i></span>GIUS</div>
    <div class="sub">Конструктор документів</div>
  </div>
  <div class="card">
    <div class="field">
      <label for="doctype">Тип документа</label>
      <select id="doctype">
        <option value="dohovir">Договір про надання правничої допомоги</option>
        <option value="uhoda">Додаткова угода до договору</option>
        <option value="rakhunok">Рахунок-фактура</option>
      </select>
    </div>
    <div class="field">
      <label for="lawyer">Адвокат</label>
      <select id="lawyer"></select>
    </div>

    <div class="only-dohovir">
      <div class="row2f">
        <div class="field">
          <label for="cdate">Дата договору</label>
          <input id="cdate" type="date">
        </div>
        <div class="field">
          <label for="cseq">№ за день</label>
          <input id="cseq" type="number" min="1" step="1" value="1">
        </div>
      </div>
      <div class="field"><div class="meta" id="numPreview"></div></div>
    </div>

    <div class="only-ur">
      <div class="row2f only-ur">
        <div class="field">
          <label for="udn">№ договору</label>
          <input id="udn" placeholder="напр. 0910-2/25" autocomplete="off">
        </div>
        <div class="field">
          <label for="udd">Дата договору</label>
          <input id="udd" type="date">
        </div>
      </div>
      <div class="row2f only-ur">
        <div class="field">
          <label for="unum">№ додаткової угоди</label>
          <input id="unum" type="number" min="1" step="1" value="1">
        </div>
        <div class="field">
          <label for="udate">Дата угоди</label>
          <input id="udate" type="date">
        </div>
      </div>
    </div>

    <div class="only-rakhunok">
      <div class="row2f only-rakhunok">
        <div class="field">
          <label for="rnum">№ рахунку</label>
          <input id="rnum" inputmode="numeric" placeholder="0001" autocomplete="off">
        </div>
        <div class="field">
          <label for="rdate">Дата рахунку</label>
          <input id="rdate" type="date">
        </div>
      </div>
      <div class="field">
        <label for="rsum">Сума, грн</label>
        <input id="rsum" inputmode="decimal" placeholder="10000 або 10000.50" autocomplete="off">
        <div class="meta" id="sumPreview"></div>
      </div>
    </div>

    <div class="sect">Клієнт</div>
    <div class="field">
      <label for="cname">ПІБ (повністю)</label>
      <input id="cname" placeholder="Прізвище Ім'я По батькові" autocomplete="off">
    </div>
    <div class="row2f">
      <div class="field">
        <label for="cgender">Стать</label>
        <select id="cgender">
          <option value="m">Чоловіча</option>
          <option value="f">Жіноча</option>
        </select>
      </div>
      <div class="field only-dohovir">
        <label for="cdob">Дата народження</label>
        <input id="cdob" type="date">
      </div>
      <div class="field only-uhoda" style="display:none"></div>
    </div>
    <div class="field">
      <label for="caddr">Зареєстрований(-а) за адресою</label>
      <input id="caddr" placeholder="індекс, місто, вулиця, будинок, квартира" autocomplete="off">
    </div>
    <div class="row2f">
      <div class="field">
        <label for="ctax">РНОКПП</label>
        <input id="ctax" inputmode="numeric" maxlength="10" placeholder="10 цифр" autocomplete="off">
      </div>
      <div class="field">
        <label for="cphone">Засоби звʼязку</label>
        <input id="cphone" placeholder="38 (0__) ___ __ __" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label for="cemail">Електронна пошта</label>
      <input id="cemail" type="email" placeholder="client@email.com" autocomplete="off">
    </div>

    <div class="only-uhoda">
      <div class="sect">Умови додаткової угоди</div>
      <div class="field">
        <label for="usubject">Предмет: правнича допомога з питань… (п. 1)</label>
        <textarea id="usubject" rows="4" placeholder="напр.: підготовка та подання позовної заяви від імені та в інтересах Клієнта до …"></textarea>
        <div class="meta">Текст підставиться після слів «…з наступних питань:»</div>
      </div>
      <div class="field">
        <label for="uprice">Вартість (п. 2 — повний текст пункту)</label>
        <textarea id="uprice" rows="4">Сторони погодили, що вартість правничої допомоги, яка надається за цією Додатковою угодою, визначається на погодинній основі та становить ______ (________________) гривень 00 копійок за одну годину роботи адвоката.</textarea>
      </div>
      <div class="field">
        <label for="uadvance">Аванс (п. 3.2 — повний текст пункту)</label>
        <textarea id="uadvance" rows="3">У момент підписання цієї Додаткової угоди, Клієнт бере на себе обов’язок авансувати перші п’ять годин роботи Адвоката на підставі виставленого рахунку, відповідно до умов цієї Додаткової угоди.</textarea>
      </div>
    </div>

    <button class="btn" id="makeBtn" disabled>Сформувати документ</button>
    <div class="note">Дані нікуди не надсилаються — документ формується у вашому браузері.</div>
  </div>
  <footer>Внутрішня сторінка LEGIUS · не для клієнтів</footer>
</div>
</div>

<div id="docWrap">
  <div class="docbar">
    <button class="back" onclick="document.body.classList.remove('doc-mode')">← Редагувати</button>
    <button class="print" onclick="window.print()">Друк / Зберегти PDF</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

    "SUB6",
    "Розмір гонорару та порядок розрахунків за надання правничої допомоги Клієнту в судах апеляційної та касаційної інстанцій узгоджуються Сторонами додатково.",
    "Дана Додаткова угода набирає чинності з моменту її підписання Сторонами.",
    "Дана Додаткова угода складена українською мовою у двох оригінальних примірниках, які мають однакову юридичну силу, по одному для кожної із Сторін, одна із яких зберігається в Клієнта, а друга в Адвоката.",
    "Дана Додаткова угода є невід’ємною частиною Договору про надання правничої допомоги № {{DN}} від {{DD}}."
  ];
  var SUB3 = [
    "3.1. Оплата правничої допомоги здійснюється щомісячно, на підставі наданого Адвокатом Акта приймання-передачі наданої правничої допомоги та рахунку, відповідно до умов цієї Додаткової угоди.",
    "3.2. {{ADVANCE}}",
    "3.3. Клієнт також бере на себе зобов’язання по оплаті судових витрат, визначених п. 4.5. Розділу 4 Договору."
  ];
  var SUB6 = [
    "6.1. Правнича допомога вважаються наданою після підписання Сторонами Акту приймання-передачі наданої правничої допомоги.",
    "6.2. Адвокат надає Клієнту Акт приймання-передачі наданої правничої допомоги, в якому зазначається зміст наданої правничої допомоги, розмір гонорару, який підлягає сплаті відповідно до умов Договору, додаткові витрати, які були понесені Адвокатом понад узгоджену суму гонорару (якщо такі мали місце).",
    "6.3. Клієнт зобов’язаний впродовж 3-х днів з моменту отримання Акту приймання-передачі наданої правничої допомоги підписати його або впродовж вказаного строку надати письмове заперечення, в якому обґрунтувати причину відмови від приймання наданої правничої допомоги та підписання відповідного акту.",
    "6.4. Якщо впродовж строку, вказаного в пункті 6.3 цієї Додаткової угоди Клієнт не підписав Акт приймання-передачі наданої правничої допомоги і не надав письмового заперечення, правнича допомога вважається наданою та прийнятою Клієнтом і підлягає оплаті впродовж 3-х днів після надання (надсилання) Клієнту відповідного рахунку на оплату."
  ];

  var $ = function (id) { return document.getElementById(id); };
  var doctype = $("doctype"), sel = $("lawyer");
  Object.keys(LAWYERS).forEach(function (k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = LAWYERS[k].label;
    sel.appendChild(o);
  });
  $("cdate").valueAsDate = new Date();
  $("udate").valueAsDate = new Date();

  doctype.onchange = function () {
    document.body.setAttribute("data-doc", doctype.value);
    if (doctype.value === "rakhunok") prefillInvoiceNum();
    validate();
  };

  function fmtDate(iso) { var p = iso.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
  var MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня",
                    "липня","серпня","вересня","жовтня","листопада","грудня"];
  function fmtDateWords(iso) {
    var p = iso.split("-");
    return p[2] + " " + MONTHS_GEN[parseInt(p[1], 10) - 1] + " " + p[0] + " р.";
  }
  /* сума прописом (гривні/копійки) */
  function plural(n, one, few, many) {
    n = n % 100;
    if (n > 10 && n < 20) return many;
    n = n % 10;
    if (n === 1) return one;
    if (n >= 2 && n <= 4) return few;
    return many;
  }
  var W1m = ["", "один", "два", "три", "чотири", "п’ять", "шість", "сім", "вісім", "дев’ять"];
  var W1f = ["", "одна", "дві", "три", "чотири", "п’ять", "шість", "сім", "вісім", "дев’ять"];
  var W10 = ["", "десять", "двадцять", "тридцять", "сорок", "п’ятдесят", "шістдесят", "сімдесят", "вісімдесят", "дев’яносто"];
  var W11 = ["десять","одинадцять","дванадцять","тринадцять","чотирнадцять","п’ятнадцять","шістнадцять","сімнадцять","вісімнадцять","дев’ятнадцять"];
  var W100 = ["", "сто", "двісті", "триста", "чотириста", "п’ятсот", "шістсот", "сімсот", "вісімсот", "дев’ятсот"];
  function triadWords(n, fem) {
    var out = [];
    if (n >= 100) { out.push(W100[Math.floor(n / 100)]); n = n % 100; }
    if (n >= 10 && n <= 19) { out.push(W11[n - 10]); n = 0; }
    else if (n >= 20) { out.push(W10[Math.floor(n / 10)]); n = n % 10; }
    if (n > 0) out.push((fem ? W1f : W1m)[n]);
    return out.join(" ");
  }
  function uahWords(total) {
    var grn = Math.floor(total);
    var kop = Math.round((total - grn) * 100);
    var parts = [];
    if (grn === 0) parts.push("нуль");
    var mln = Math.floor(grn / 1000000);
    var th = Math.floor((grn % 1000000) / 1000);
    var rest = grn % 1000;
    if (mln) parts.push(triadWords(mln, false) + " " + plural(mln, "мільйон", "мільйони", "мільйонів"));
    if (th) parts.push(triadWords(th, true) + " " + plural(th, "тисяча", "тисячі", "тисяч"));
    if (rest) parts.push(triadWords(rest, true));
    var kopStr = (kop < 10 ? "0" : "") + kop;
    return parts.join(" ") + " " + plural(grn, "гривня", "гривні", "гривень") + " " + kopStr + " " + plural(kop, "копійка", "копійки", "копійок");
  }
  function fmtSum(total) {
    var grn = Math.floor(total);
    var kop = Math.round((total - grn) * 100);
    var sInt = String(grn).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return kop ? sInt + "," + (kop < 10 ? "0" : "") + kop : sInt;
  }
  function shortName(full) {
    var w = full.trim().split(/\s+/);
    var s = w[0];
    if (w[1]) s += " " + w[1].charAt(0).toUpperCase() + ".";
    if (w[2]) s += w[2].charAt(0).toUpperCase() + ".";
    return s;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  /* № договору: ДДММ-N/РР; лічильник за день пам'ятається в браузері */
  function contractNo() {
    var p = $("cdate").value.split("-");
    var n = parseInt($("cseq").value, 10) || 1;
    return p[2] + p[1] + "-" + n + "/" + p[0].slice(2);
  }
  function prefillSeq() {
    var used = parseInt(localStorage.getItem("legius_doc_seq_" + $("cdate").value) || "0", 10);
    $("cseq").value = used + 1;
  }
  function updNumPreview() {
    $("numPreview").textContent = $("cdate").value ? "Номер договору: № " + contractNo() : "";
  }
  $("cdate").addEventListener("change", function () { prefillSeq(); updNumPreview(); });
  $("cseq").addEventListener("input", updNumPreview);

  $("rdate").valueAsDate = new Date();
  function prefillInvoiceNum() {
    var used = parseInt(localStorage.getItem("legius_inv_num_" + sel.value) || "0", 10);
    $("rnum").value = String(used + 1).padStart(4, "0");
  }
  sel.addEventListener("change", function () { if (doctype.value === "rakhunok") prefillInvoiceNum(); });
  $("rsum").addEventListener("input", function () {
    var v = parseFloat(this.value.replace(",", "."));
    $("sumPreview").textContent = v > 0 ? fmtSum(v) + " (" + uahWords(v) + ")" : "";
  });

  /* стать: автопідказка з по батькові */
  $("cname").addEventListener("input", function () {
    var w = this.value.trim().split(/\s+/);
    if (w.length >= 3) $("cgender").value = /на$/i.test(w[2]) ? "f" : "m";
  });

  function validate() {
    var okCommon = $("cname").value.trim().split(/\s+/).length >= 2 &&
      /^\d{10}$/.test($("ctax").value.trim()) &&
      $("caddr").value.trim().length > 5 &&
      $("cphone").value.trim().length > 5 &&
      $("cemail").value.trim().length > 4;
    var ok;
    if (doctype.value === "dohovir") {
      ok = okCommon && $("cdate").value && $("cdob").value;
    } else if (doctype.value === "uhoda") {
      ok = okCommon && $("udn").value.trim() && $("udd").value && $("udate").value &&
        $("usubject").value.trim().length > 5 && $("uprice").value.trim().length > 5 &&
        $("uadvance").value.trim().length > 5;
    } else {
      ok = okCommon && $("udn").value.trim() && $("udd").value && $("udate").value &&
        $("rnum").value.trim() && $("rdate").value &&
        parseFloat(($("rsum").value || "").replace(",", ".")) > 0;
    }
    $("makeBtn").disabled = !ok;
  }
  ["cname","cdob","ctax","cdate","cseq","caddr","cphone","cemail","udn","udd","unum","udate","usubject","uprice","uadvance","cgender","rnum","rdate","rsum"]
    .forEach(function (id) { $(id).addEventListener("input", validate); $(id).addEventListener("change", validate); });
  prefillSeq(); updNumPreview();

  function clientData() {
    return {
      name: $("cname").value.trim().replace(/\s+/g, " "),
      gender: $("cgender").value,
      addr: $("caddr").value.trim(),
      tax: $("ctax").value.trim(),
      phone: $("cphone").value.trim(),
      email: $("cemail").value.trim()
    };
  }
  function reqBlock(L, C) {
    var regWord = C.gender === "f" ? "Зареєстрована" : "Зареєстрований";
    return '<div class="req"><div>' +
      '<div class="rt">АДВОКАТ:</div>' +
      "<div><b>" + esc(L.name) + "</b></div>" +
      "<div>Свідоцтво про право на заняття адвокатською діяльністю " + esc(L.svid) + ", видане " + esc(L.organ) + "</div>" +
      "<div>" + esc(L.addrLabel) + ": " + esc(L.addr) + "</div>" +
      "<div>Засоби зв’язку: " + esc(L.phone) + "</div>" +
      "<div>Електронна пошта: " + esc(L.email) + "</div>" +
      '<div class="sig">___________________/ ' + esc(L.short) + " /</div>" +
      "</div><div>" +
      '<div class="rt">КЛІЄНТ:</div>' +
      "<div><b>" + esc(C.name) + "</b></div>" +
      "<div>" + regWord + " за адресою: " + esc(C.addr) + "</div>" +
      "<div>РНОКПП: " + esc(C.tax) + "</div>" +
      "<div>Засоби зв’язку: " + esc(C.phone) + "</div>" +
      "<div>Електронна пошта: " + esc(C.email) + "</div>" +
      '<div class="sig">___________________/ ' + esc(shortName(C.name)) + " /</div>" +
      "</div></div>";
  }
  function advHead(L) {
    return "Адвокат, <b>" + esc(L.name) + "</b>, який діє на підставі Свідоцтва про право на заняття адвокатською діяльністю " +
      esc(L.svid) + ", виданого " + esc(L.organ) + ", надалі за змістом Договору іменується «Адвокат», з однієї сторони та";
  }

  function renderDohovir() {
    var L = LAWYERS[sel.value], C = clientData();
    var no = contractNo(), date = fmtDate($("cdate").value), dob = fmtDate($("cdob").value);
    try {
      var usedNow = parseInt($("cseq").value, 10) || 1;
      var stored = parseInt(localStorage.getItem("legius_doc_seq_" + $("cdate").value) || "0", 10);
      if (usedNow > stored) localStorage.setItem("legius_doc_seq_" + $("cdate").value, String(usedNow));
    } catch (e) {}
    var clientHead = "<b>" + esc(C.name) + "</b>, " + esc(dob) + " р.н., реєстраційний номер облікової картки платника податків: " +
      esc(C.tax) + ", надалі за змістом Договору іменується «Клієнт» з другої сторони,";
    var h = 0, s1 = 0, s2 = 0, out = [];
    PARAS.forEach(function (p) {
      var kind = p[0], text = p[1];
      if (text === "{{ADV_HEAD}}") text = advHead(L);
      else if (text === "{{CLIENT_HEAD}}") text = clientHead;
      else text = esc(text);
      if (kind === "T") {
        if (text === "ДОГОВІР") text = "ДОГОВІР № " + esc(no);
        out.push('<div class="title">' + text + "</div>");
      }
      else if (kind === "CITY") out.push('<div class="cityline"><span>м. Київ</span><span>' + esc(date) + "</span></div>");
      else if (kind === "H") { h++; s1 = 0; s2 = 0; out.push("<h2>" + h + ". " + text + "</h2>"); }
      else if (kind === "1") { s1++; s2 = 0; out.push('<p class="body">' + h + "." + s1 + ". " + text + "</p>"); }
      else if (kind === "2") { s2++; out.push('<p class="body">' + h + "." + s1 + "." + s2 + ". " + text + "</p>"); }
      else out.push('<p class="body">' + text + "</p>");
    });
    out.push(reqBlock(L, C));
    return out.join("");
  }

  function renderUhoda() {
    var L = LAWYERS[sel.value], C = clientData();
    var dn = $("udn").value.trim(), dd = fmtDate($("udd").value),
        un = parseInt($("unum").value, 10) || 1, ud = fmtDate($("udate").value);
    var out = [];
    out.push('<div class="title">ДОДАТКОВА УГОДА № ' + un + "</div>");
    out.push('<div class="title">ДО ДОГОВОРУ ПРО НАДАННЯ ПРАВНИЧОЇ ДОПОМОГИ № ' + esc(dn) + " від " + esc(dd) + "</div>");
    out.push('<div class="cityline"><span>м. Київ</span><span>' + esc(ud) + "</span></div>");
    out.push('<p class="body">' + advHead(L) + "</p>");
    out.push('<p class="body"><b>' + esc(C.name) + "</b>, реєстраційний номер облікової картки платника податків: " +
      esc(C.tax) + ", надалі за змістом Договору іменується «Клієнт» з другої сторони,</p>");
    out.push('<p class="body">при спільному згадуванні «Сторони», а кожна окремо «Сторона», керуючись п. 4.2. розділу 4 Договору про надання правничої допомоги № ' +
      esc(dn) + " від " + esc(dd) + ", надалі іменується «Договір», уклали дану Додаткову угоду, надалі іменується «Додаткова угода» про наступне:</p>");
    var n = 0;
    UHODA_ITEMS.forEach(function (item) {
      if (item === "SUB3") {
        n++;
        out.push('<p class="body">' + n + ". Порядок оплати гонорару:</p>");
        SUB3.forEach(function (t) {
          t = t.replace("{{ADVANCE}}", esc($("uadvance").value.trim()));
          out.push('<p class="body">' + (t.indexOf("{{") === -1 ? esc(t).replace(/^(\d\.\d\.)/, "$1") : t) + "</p>");
        });
        return;
      }
      if (item === "SUB6") {
        n++;
        out.push('<p class="body">' + n + ". Порядок приймання-передачі наданої правничої допомоги:</p>");
        SUB6.forEach(function (t) { out.push('<p class="body">' + esc(t) + "</p>"); });
        return;
      }
      n++;
      var text = item
        .replace("{{SUBJECT}}", esc($("usubject").value.trim()))
        .replace("{{PRICE}}", esc($("uprice").value.trim()))
        .replace("{{DN}}", esc(dn))
        .replace("{{DD}}", esc(dd));
      if (item.indexOf("{{SUBJECT}}") === -1 && item.indexOf("{{PRICE}}") === -1 &&
          item.indexOf("{{DN}}") === -1) text = esc(item);
      out.push('<p class="body">' + n + ". " + text + "</p>");
    });
    out.push('<h2>РЕКВІЗИТИ ТА ПІДПИСИ СТОРІН</h2>');
    out.push(reqBlock(L, C));
    return out.join("");
  }

  function renderRakhunok() {
    var L = LAWYERS[sel.value], C = clientData();
    var dn = $("udn").value.trim(), dd = fmtDate($("udd").value),
        un = parseInt($("unum").value, 10) || 1, ud = fmtDate($("udate").value);
    var num = $("rnum").value.trim();
    var total = parseFloat($("rsum").value.replace(",", "."));
    try {
      var nInt = parseInt(num, 10);
      var stored = parseInt(localStorage.getItem("legius_inv_num_" + sel.value) || "0", 10);
      if (nInt > stored) localStorage.setItem("legius_inv_num_" + sel.value, String(nInt));
    } catch (e) {}
    var regWord = C.gender === "f" ? "Зареєстрована" : "Зареєстрований";
    var purpose = "Сплата за послуги, на підставі Додаткової угоди № " + un + " від " + ud +
      " до Договору № " + dn + " від " + dd;
    var sig = SIGNATURES[sel.value] ? '<img src="' + SIGNATURES[sel.value] + '" alt="">' : "";
    return '<div style="font-size:9pt">Тел.: ' + esc(L.phone) + " Адреса електронної пошти: " + esc(L.email) + "</div>" +
      '<div class="inv-head">' +
        '<div><div class="inv-title">Рахунок-фактура ' + esc(num) + "</div></div>" +
        '<div class="r"><b>' + esc(L.name) + "</b><br>" +
        "Реєстраційний номер облікової картки платника податків: " + esc(L.taxid) + "<br>" +
        "Банківські реквізити:<br>IBAN: " + esc(L.iban) + "<br>" + esc(L.bank) + "<br>МФО " + esc(L.mfo) + "</div>" +
      "</div>" +
      '<table class="itable"><tr><th style="width:22%">Дата</th><th>Кому</th><th style="width:22%">Адреса доставки</th></tr>' +
      "<tr><td>" + esc(fmtDateWords($("rdate").value)) + "</td>" +
      "<td><b>" + esc(C.name) + "</b><br>" + regWord + " за адресою: " + esc(C.addr) + "<br>РНОКПП: " + esc(C.tax) +
      "<br>Засоби зв’язку: " + esc(C.phone) + "<br>Електронна пошта: " + esc(C.email) + "</td>" +
      "<td>Див. адресу одержувача</td></tr></table>" +
      '<table class="itable"><tr><th style="width:10%">Номер п/п</th><th>Призначення платежу</th><th style="width:12%">Кількість</th><th style="width:16%">Сума, грн</th></tr>' +
      "<tr><td style=\"text-align:center\">1</td><td>" + esc(purpose) + "</td><td style=\"text-align:center\">1</td>" +
      "<td style=\"text-align:right\">" + fmtSum(total) + "</td></tr>" +
      '<tr><td colspan="3" style="text-align:right;font-weight:bold">Загальна сума:</td>' +
      "<td style=\"text-align:right;font-weight:bold\">" + fmtSum(total) + "</td></tr></table>" +
      '<p class="body" style="text-indent:0;margin-top:6px"><b>' + fmtSum(total) + " (" + esc(uahWords(total)) + ")</b></p>" +
      '<div class="vypysav">Виписав:<span class="line">' + sig + "</span><span>" + esc(L.short) + "</span></div>";
  }

  $("makeBtn").onclick = function () {
    $("sheet").innerHTML = doctype.value === "dohovir" ? renderDohovir()
      : doctype.value === "uhoda" ? renderUhoda() : renderRakhunok();
    document.body.classList.add("doc-mode");
    window.scrollTo(0, 0);
  };
})();
</script>
</body>
</html>
