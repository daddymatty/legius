<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0F">
<meta name="robots" content="noindex, nofollow">
<title>Новий рахунок — LEGIUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#0D0D0F; --ink:#101828; --mut:#818a9c; --line:#e9ecf2;
    --bg:#f2f4f7; --card:#ffffff; --accent:#E13D27;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:480px; margin:0 auto; padding-bottom:36px; }
  .head { background:var(--black); color:#fff; padding:26px 20px 48px; border-top:3px solid var(--accent);
           display:flex; flex-direction:column; align-items:center; gap:8px; }
  .logo { display:flex; align-items:center; font-family:'Jost',Montserrat,system-ui,sans-serif;
           font-weight:300; font-size:30px; letter-spacing:.34em; color:#fff; line-height:1; }
  .logo .e { display:flex; flex-direction:column; justify-content:space-between;
              width:.5em; height:.7em; margin-right:.34em; }
  .logo .e i { display:block; width:100%; height:.052em; background:#fff; }
  .logo .e i:first-child { background:var(--accent); }
  .head .sub { font-size:12.5px; color:#9aa1af; letter-spacing:1.2px; text-transform:uppercase; }

  .card { background:var(--card); border-radius:18px; margin:-28px 14px 0; padding:20px 18px;
           box-shadow:0 6px 20px rgba(13,13,15,.12); }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; font-weight:700; letter-spacing:.8px;
                  text-transform:uppercase; color:var(--mut); margin-bottom:6px; }
  .field select, .field input, .field textarea {
    width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--line);
    border-radius:12px; background:#fbfcfe; color:var(--ink); outline:none;
  }
  .field select:focus, .field input:focus, .field textarea:focus { border-color:var(--accent); background:#fff; }
  .field textarea { resize:vertical; min-height:64px; }
  .field .meta { display:flex; justify-content:space-between; font-size:11.5px; color:var(--mut); margin-top:4px; }
  .req-preview { font-size:12px; color:var(--mut); background:#f6f8fb; border-radius:10px;
                  padding:10px 12px; margin-top:6px; font-family:ui-monospace,'SF Mono',monospace; word-break:break-all; }

  .btn { display:block; width:100%; font:inherit; font-size:16px; font-weight:700; color:#fff;
          background:var(--accent); border:none; border-radius:12px; padding:14px; cursor:pointer; }
  .btn:active { filter:brightness(.92); }
  .btn[disabled] { background:#c9ced8; cursor:not-allowed; }

  .result { background:var(--card); border-radius:18px; margin:16px 14px 0; padding:20px 18px;
             box-shadow:0 1px 3px rgba(13,13,15,.06); display:none; }
  .result.show { display:block; }
  .result h2 { font-size:14px; letter-spacing:.8px; text-transform:uppercase; color:var(--mut); margin-bottom:10px; }
  .linkbox { font-size:12.5px; font-family:ui-monospace,'SF Mono',monospace; word-break:break-all;
              background:#f6f8fb; border-radius:10px; padding:10px 12px; margin-bottom:12px; max-height:110px; overflow:auto; }
  .row2 { display:flex; gap:10px; }
  .btn2 { flex:1; font:inherit; font-size:14.5px; font-weight:700; padding:12px; border-radius:12px;
           border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .btn2.primary { background:var(--black); color:#fff; border-color:var(--black); }
  .btn2:active { filter:brightness(.95); }
  .note { font-size:12px; color:var(--mut); margin-top:10px; line-height:1.5; }
  footer { text-align:center; font-size:12px; color:var(--mut); margin-top:24px; padding:0 20px; }
  .toast { position:fixed; bottom:24px; left:50%; opacity:0; pointer-events:none; transform:translateX(-50%) translateY(90px);
            background:var(--black); color:#fff; font-size:13.5px; padding:10px 18px; border-radius:12px;
            transition:.25s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
  .btn:focus-visible, .btn2:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">L<span class="e"><i></i><i></i><i></i></span>GIUS</div>
    <div class="sub">Новий рахунок</div>
  </div>

  <div class="card">
    <div class="field">
      <label for="lawyer">Юрист (одержувач коштів)</label>
      <select id="lawyer"></select>
      <div class="req-preview" id="reqPreview"></div>
    </div>
    <div class="field">
      <label for="amount">Сума, грн</label>
      <input id="amount" inputmode="decimal" placeholder="7000 або 7000.50" autocomplete="off">
    </div>
    <div class="field">
      <label for="svc">Назва послуги (на картці суми)</label>
      <input id="svc" value="Юридичні послуги" autocomplete="off">
    </div>
    <div class="field">
      <label for="purpose">Призначення платежу</label>
      <textarea id="purpose" maxlength="140">Сплата за юридичні послуги</textarea>
      <div class="meta"><span>заповнюється вручну — потрапить у платіж клієнта</span><span id="pCount">0/140</span></div>
    </div>
    <button class="btn" id="makeBtn" disabled>Створити посилання на оплату</button>
  </div>

  <div class="result" id="result">
    <h2>Посилання для клієнта</h2>
    <div class="linkbox" id="linkBox"></div>
    <div class="row2">
      <button class="btn2 primary" id="copyLink">Скопіювати посилання</button>
      <button class="btn2" id="openLink">Відкрити</button>
    </div>
    <div class="row2" style="margin-top:10px">
      <button class="btn2" id="copyMsg">Скопіювати повідомлення для клієнта</button>
    </div>
    <div class="note">Клієнт на сторінці нічого не редагує — лише обирає банк і платить.
      Одне посилання = один рахунок; для нового рахунку сформуйте нове посилання.</div>
  </div>

  <footer>Внутрішня сторінка LEGIUS · не для клієнтів</footer>
</div>
<div class="toast" id="toast">Скопійовано</div>

<script>
(function () {
  /* Довідник має збігатися з RECIPIENTS у /pay/index.html.
     Додаєш юриста — додай його в ОБИДВА файли з одним ключем. */
  var RECIPIENTS = {
    hordiienko: {
      label: "Олександр Гордієнко — ФОП",
      name: "ФОП Гордієнко Олександр Сергійович",
      iban: "UA533220010000026005310108744",
      bank: "АТ Універсал Банк",
      taxid: "3540107172"
    },
    kobylianskyi: {
      label: "Михайло Кобилянський — ФОП",
      name: "ФОП Кобилянський Михайло Вікторович",
      iban: "UA523220010000026000310057425",
      bank: "АТ Універсал Банк",
      taxid: "3506211556"
    },
    slobodianin: {
      label: "Максим Слободянін — ФОП",
      name: "ФОП Слободянін Максим Вікторович",
      iban: "UA473220010000026005320028751",
      bank: "АТ Універсал Банк",
      taxid: "3492704158"
    }
  };
  var PAY_URL = location.origin + "/pay/";

  function b64uEncode(s) {
    var bin = unescape(encodeURIComponent(s));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function bytesToB64u(u8) {
    var bin = "";
    for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  var RSHORT = { hordiienko: "h", kobylianskyi: "k", slobodianin: "s" };
  var DEF_SVC = "Юридичні послуги";
  var DEF_PURPOSE = "Сплата за юридичні послуги";
  /* компактний фрагмент: дефолти опускаємо, кирилицю стискаємо deflate-ом */
  function makeFragment(d) {
    var compact = [d.a, RSHORT[d.r] || d.r, d.s === DEF_SVC ? "" : d.s, d.p === DEF_PURPOSE ? "" : d.p].join("\n");
    var plain = "c" + b64uEncode(compact);
    if (!window.CompressionStream) return Promise.resolve(plain);
    return new Response(new Blob([compact]).stream().pipeThrough(new CompressionStream("deflate-raw")))
      .arrayBuffer()
      .then(function (buf) {
        var z = "z" + bytesToB64u(new Uint8Array(buf));
        return z.length < plain.length ? z : plain;
      })
      .catch(function () { return plain; });
  }

  var sel = document.getElementById("lawyer");
  Object.keys(RECIPIENTS).forEach(function (k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = RECIPIENTS[k].label;
    sel.appendChild(o);
  });

  function updPreview() {
    var r = RECIPIENTS[sel.value];
    document.getElementById("reqPreview").textContent =
      r.name + " · РНОКПП " + r.taxid + " · " + r.iban + " (" + r.bank + ")";
  }
  sel.onchange = updPreview; updPreview();

  var amount = document.getElementById("amount");
  var svc = document.getElementById("svc");
  var purpose = document.getElementById("purpose");
  var makeBtn = document.getElementById("makeBtn");
  var pCount = document.getElementById("pCount");

  function amountOk() {
    return /^\d+([.,]\d{1,2})?$/.test(amount.value.trim()) && parseFloat(amount.value.replace(",", ".")) > 0;
  }
  function validate() {
    pCount.textContent = purpose.value.length + "/140";
    makeBtn.disabled = !(amountOk() && purpose.value.trim().length >= 5);
  }
  amount.oninput = validate; purpose.oninput = validate; svc.oninput = validate;
  validate();

  var currentLink = "";
  makeBtn.onclick = function () {
    var a = amount.value.trim().replace(",", ".");
    var d = { a: a, s: svc.value.trim() || DEF_SVC, p: purpose.value.trim(), r: sel.value };
    makeFragment(d).then(function (fragStr) {
      currentLink = PAY_URL + "#" + fragStr;
      document.getElementById("linkBox").textContent = currentLink;
      document.getElementById("result").classList.add("show");
      document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };

  function copyText(t) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(function () {
      var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    });
    var toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 1400);
  }
  document.getElementById("copyLink").onclick = function () { copyText(currentLink); };
  document.getElementById("openLink").onclick = function () { window.open(currentLink, "_blank"); };
  document.getElementById("copyMsg").onclick = function () {
    var a = amount.value.trim().replace(",", ".");
    copyText("Добрий день! Надсилаємо рахунок на оплату юридичних послуг — " + a +
      " грн.\nОплатити зручно за посиланням (картка або банківський застосунок):\n" + currentLink +
      "\n\nЗ повагою, Юридична компанія «ЛЕГІУС»");
  };
})();
</script>
</body>
</html>
