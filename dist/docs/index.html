ackground:#fff}.docbar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}@page{size:A4;margin:20mm 15mm 20mm 25mm}}</style> </head> <body> <div id="formWrap"> <div class="wrap"> <div class="head"> <div class="logo">L<span class="e"><i></i><i></i><i></i></span>GIUS</div> <div class="sub">Договір про правничу допомогу</div> </div> <div class="card"> <div class="field"> <label for="lawyer">Адвокат</label> <select id="lawyer"></select> </div> <div class="field"> <label for="cdate">Дата договору</label> <input id="cdate" type="date"> </div> <div class="field"> <label for="cname">ПІБ клієнта (повністю)</label> <input id="cname" placeholder="Прізвище Ім'я По батькові" autocomplete="off"> </div> <div class="field"> <label for="cdob">Дата народження клієнта</label> <input id="cdob" type="date"> </div> <div class="field"> <label for="ctax">РНОКПП клієнта</label> <input id="ctax" inputmode="numeric" maxlength="10" placeholder="10 цифр" autocomplete="off"> <div class="meta">Дані нікуди не надсилаються — договір формується у вашому браузері.</div> </div> <button class="btn" id="makeBtn" disabled="disabled">Сформувати договір</button> </div> <footer>Внутрішня сторінка LEGIUS · не для клієнтів</footer> </div> </div> <div id="docWrap"> <div class="docbar"> <button class="back" onclick='document.body.classList.remove("doc-mode")'>← Редагувати</button> <button class="print" onclick="window.print()">Друк / Зберегти PDF</button> </div> <div class="sheet" id="sheet"></div> </div> <script>!function(){var e={kobylianskyi:{label:"Кобилянський Михайло Вікторович",name:"Кобилянський Михайло Вікторович",short:"Кобилянський М.В.",svid:"№ 10019/10 від 21.05.2021",organ:"Радою адвокатів Київської області",addrLabel:"Адреса робочого місця",addr:"02144, м. Київ, вул. Софії Русової, буд. 1, кв. 113",phone:"38 (097) 111 41 23",email:"mvkobylianskyi@gmail.com"},slobodianin:{label:"Слободянін Максим Вікторович",name:"Слободянін Максим Вікторович",short:"Слободянін М.В.",svid:"№ 001150 від 24.05.2021",organ:"Радою адвокатів м. Києва",addrLabel:"Адреса для листування",addr:"02154, м. Київ, Дніпровський р-н, вул. Ентузіастів, буд. 23, кв. 99",phone:"+38 (093) 689 33 54",email:"m.slobodianin@gmail.com"}},a=[["T","ДОГОВІР"],["T","ПРО НАДАННЯ ПРАВНИЧОЇ ДОПОМОГИ"],["CITY",""],["P","{{ADV_HEAD}}"],["P","{{CLIENT_HEAD}}"],["P","при спільному згадуванні «Сторони», а кожна окремо «Сторона», керуючись положеннями Закону України «Про адвокатуру та адвокатську діяльність», уклали даний Договір про наступне:"],["H","ПРЕДМЕТ ДОГОВОРУ"],["1","Клієнт доручає, а Адвокат бере на себе зобов’язання надати усіма законними методами та способами правничу допомогу Клієнту у всіх справах, які пов’язані чи можуть бути пов’язані із захистом та відновленням порушених, оспорюваних, невизнаних прав та законних інтересів Клієнта на території України, в порядку та на умовах, передбаченими даним Договором та/або додаткових угодах до даного Договору, а Клієнт зобов’язується оплатити надану правничу допомогу в порядку та на умовах, передбаченими Договором та/або додатковими угодами до даного Договору."],["1","Правнича допомога, що надається на підставі даного Договору та/або додаткових угод до даного Договору, може мати одноразовий чи систематичний характер і складатися з комплексу дій чи самостійних операцій необхідних і достатніх для досягнення мети, поставленої Клієнтом."],["1","Види, характер, обсяг, порядок надання і строки правничої допомоги визначаються Сторонами в умовах даного Договору чи додаткових угодах до даного Договору."],["H","ПРАВА ТА ОБОВ’ЯЗКИ КЛІЄНТА"],["1","КЛІЄНТ ЗОБОВ’ЯЗУЄТЬСЯ:"],["2","своєчасно та у повному обсязі сплачувати надану правничу допомогу та витрати, які пов’язані із наданням такої правничої допомоги, Адвокату в порядку та на умовах, визначених даним Договором;"],["2","надавати Адвокату документи, необхідні для надання правничої допомоги Клієнту;"],["2","надавати Адвокату додаткові документи, необхідність у використанні яких виникла в ході надання правничої допомоги Клієнту;"],["2","інформувати Адвоката про всі документи та відомі обставини, які можуть мати суттєве значення для прийняття та виконання Адвокатом доручення відповідно до даного Договору."],["2","своєчасно, в порядку та на умовах, визначених в Договорі чи в додаткових угодах до цього Договору, компенсувати додаткові витрати Адвоката;"],["2","у разі дострокового розірвання Договору, здійснити Адвокату оплату за фактично надану останнім правничу допомогу та оплатити фактичні додаткові витрати Адвокату;"],["2","Не вимагати від Адвоката виконання дій, що виходять за межі професійних прав і обов’язків Адвоката."],["1","КЛІЄНТ МАЄ ПРАВО:"],["2","отримувати від Адвоката інформацію про хід правничої допомоги, шляхом отримання усних або письмових звітів на запити Клієнта;"],["2","вимагати від Адвоката збереження конфіденційності інформації, що стала відома Адвокату при наданні правничої допомоги;"],["2","розірвати цей Договір, відповідно до вимог чинного законодавства України."],["H","ПРАВА ТА ОБОВ’ЯЗКИ АДВОКАТА"],["1","АДВОКАТ ЗОБОВ’ЯЗУЄТЬСЯ:"],["2","здійснювати представництво та захист інтересів Клієнта перед фізичними та юридичними особами незалежно від форми власності, у органах державної влади та місцевого самоврядування, в тому числі але не виключно, в ПАТ «Укрпошта», органах та управліннях Міністерства юстиції України, Національного антикорупційного бюро України, Державного бюро розслідувань, Міністерства внутрішніх справ та Національної поліції України, органах Прокуратури, Служби безпеки України, підпорядкованих їм установах та організаціях, органах нотаріату, перед державними та приватними виконавцями, у судах загальної, адміністративної, господарської юрисдикції, Вищому суді з питань інтелектуальної власності, Вищому антикорупційному суді, Верховному Суді, на всіх стадіях судового процесу (в першій, апеляційній, касаційній інстанціях; за нововиявленими або виключними обставинами, виконавчому провадженні т.і.) у будь-яких формах судового провадження (позовному, наказному, окремому, спрощеному, загальному, письмовому, у справах про оскарження рішень третейських судів, оспорювання рішень міжнародних комерційних арбітражів, про видачу наказів та виконавчих листів на примусове виконання рішень третейських судів та міжнародних комерційних арбітражів, у справах за участю іноземних осіб тощо) зі всіма процесуальними правами без обмежень, що надаються стороні та іншим учасникам процесу Цивільним процесуальним, Господарським процесуальним, Кримінальним процесуальним кодексами України, Кодексом адміністративного судочинства України; особі, яка притягається до адміністративної відповідальності, потерпілому Кодексом України про адміністративні правопорушення; стороні виконавчого провадження за Законом України «Про виконавче провадження»."],["2","виконувати, в інтересах Клієнта, інші дії, передбачені законодавством України."],["1","АДВОКАТ МАЄ ПРАВО:"],["2","вимагати від Клієнта надати інформацію, документи та інші матеріали, необхідні для виконання обов'язків передбачених даним Договором;"],["2","на своєчасну та повну оплату наданої правничої допомоги, відповідно до умов даного Договору;"],["2","зупинити надання правничої допомоги у випадку нездійснення Клієнтом оплати, відповідно до умов даного Договору;"],["2","від імені та/або в інтересах Клієнта підписувати та подавати заяви, клопотання, запити, скарги, листи, звернення, адвокатські запити заявляти вимоги до вказаних у п. 3.1.1. даного Договору осіб, органів, установ, отримувати від них відповіді, витяги, оригінали документів, розписуватися за їх отримання, одержувати інформацію, в тому числі й листи, довідки або інші документи, що стосуються Клієнта, виконувати всі процесуальні дії та здійснювати всі без обмежень повноваження, що надаються стороні та іншим учасникам процесу в судових процесах (цивільному, господарському, адміністративному, кримінальному), особі, яка притягається до адміністративної відповідальності, її захиснику, потерпілому, його представнику у справах про адміністративні правопорушення, в тому числі підписувати та подавати до судів позовні заяви, клопотання, заяви, відзиви на позовні заяви, відповіді на відзиви на позовні заяви, заперечення на відповіді на відзиви на позовні заяви, апеляційні та касаційні скарги, заяви про перегляд судових рішень за нововиявленими або виключними обставинами, письмові пояснення та інші процесуальні документи учасника справи, ознайомлюватись з матеріалами справи, робити з них витяги, копії, мати право бути присутнім на слуханнях справи та приймати участь в судових засіданнях, подавати докази, приймати участь в дослідженні доказів, заявляти відводи, наводити свої докази та міркування з усіх питань, що виникають в ході судового процесу, заперечувати проти клопотань та доказів інших учасників судового процесу, змінювати підставу та предмет позову, збільшувати або зменшувати розмір позовних вимог, укладати мирову угоду, визнавати позов повністю або частково, отримувати копії рішень, постанов, та інших документів, що належать до справи, оскаржувати судові рішення, мати право примусового виконання судового рішення (виконавчого документу), подавати виконавчий документ до виконання та відкликати його, здійснювати всі права, що надаються стороні процесу при здійсненні виконавчих дій, в тому числі ознайомлюватись з матеріалами виконавчого провадження, робити з них витяги, копії, надавати додаткові матеріали, приймати участь у виконанні виконавчих дій, під час яких подавати клопотання, надавати усні та письмові пояснення, наводити свої докази та міркування з усіх питань, що виникають в процесі виконавчого провадження, заперечувати проти клопотань, доказів та міркувань інших осіб, що приймають участь у виконавчому провадженні, оскаржувати дії (бездіяльність) державного та/або приватного виконавця, оплачувати в інтересах довірителя необхідні для представництва його інтересів платежі (судовий збір, державне мито, оплату послуг нотаріуса тощо), ставити підпис та здійснювати всі пов'язані з наданням правничої допомоги, інші формальності, в тому числі відправляти та отримувати пошту (в тому числі цінні та рекомендовані листи), засвідчувати вірність копій документів."],["2","виконувати, в інтересах Клієнта, інші дії, передбачені законодавством України."],["2","залучати помічників Адвоката для виконання доручень у справах, що знаходяться у провадженні Адвоката;"],["2","розірвати цей Договір, відповідно до вимог чинного законодавства України."],["H","ПОРЯДОК ЗДІЙСНЕННЯ РОЗРАХУНКІВ"],["1","Формою винагороди Адвоката за надання правничої допомоги Клієнту – є гонорар."],["1","Порядок обчислення гонорару (фіксований розмір, погодинна оплата), підстави для зміни розміру гонорару, порядок його сплати, умови повернення тощо визначаються в Додаткових угодах до даного Договору."],["1","При встановленні розміру винагороди за правничу допомогу, враховуються: складність справи (справ), час та обсяг дій, які необхідні Адвокату для надання правничої допомоги Клієнту, ціна предмету позову та значення справи для Клієнта, в тому числі вплив вирішення справи на репутацію Клієнта або наявність публічного інтересу до правничої допомоги, що надається Клієнту, стан документів та доказів, наданих Клієнтом, та інші істотні обставини, які необхідні для надання правничої допомоги Клієнту."],["1","У разі виникнення особливих по складності доручень Клієнта або у випадку збільшення часу і обсягу допомоги Адвоката розмір гонорару може бути збільшено за взаємною домовленістю Сторін."],["1","До складу гонорару не входять додаткові витрати Адвоката при наданні правничої допомоги Клієнту. До додаткових витрат Адвоката відносяться, зокрема але не виключно:"],["2","судовий збір, адміністративний збір, авансовий внесок та інші обов’язкові види державних зборів;"],["2","банківська комісія;"],["2","поштові витрати на оформлення поштових відправлень та їх відправку;"],["2","витрати на копіювання та/або друк документів;"],["2","оформлення нотаріальної довіреності;"],["2","нотаріальне посвідче
